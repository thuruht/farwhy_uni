<!DOCTYPE html>
<!-- 
  ARCHIVED VERSION OF PUBLIC BLOG INDEX.HTML
  
  This is the original version of the blog page which included admin login functionality.
  It was archived on June 30, 2025 as part of a refactoring to simplify the public blog page
  and direct all admin activities to the main admin dashboard.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>fw/hy newz</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <link rel="stylesheet" href="../css/ccssss.css">
  <link rel="stylesheet" href="./news.css">
  <link rel="stylesheet" href="./blog-styles.css">
  <link rel="stylesheet" href="../css/admin-button-fix.css">
  <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
</head>
<body>
  <div id="public-view">
    <main>
      <section id="public-posts">
          <h2>Posts</h2>
          <div id="public-posts-list" class="card">
            Loading posts...
          </div>
      </section>
      <section id="public-featured">
          <h2>Featured</h2>
          <div id="public-featured-content" class="card">
             Loading featured...
          </div>
      </section>
    </main>
    <footer>
      <button id="login-btn">Admin Login</button>
    </footer>
  </div>
  
  <div id="admin-view" style="display: none;">
    <header>
      <h1>Blog Admin</h1>
      <button id="logout-btn">Logout</button>
    </header>
    <main>
      <section id="admin-posts">
        <h2>Manage Posts</h2>
        <button id="add-post-btn">New Post</button>
        <div id="admin-posts-list" class="card">
          Loading posts...
        </div>
      </section>
      <section id="admin-featured">
        <h2>Featured Content</h2>
        <div class="card">
          <h3>Current Featured</h3>
          <div>
            <strong>Text:</strong> <span id="current-featured-text">None</span>
          </div>
          <div>
            <strong>YouTube URL:</strong> <span id="current-featured-youtube">None</span>
          </div>
          <div id="current-featured-preview"></div>
          
          <h3>Update Featured</h3>
          <form id="featured-form">
            <div>
              <label for="featured-text">Featured Text:</label>
              <textarea id="featured-text" rows="3"></textarea>
            </div>
            <div>
              <label for="youtube-url">YouTube URLs (comma-separated):</label>
              <input type="text" id="youtube-url">
              <button type="button" id="add-youtube-btn">Add Video</button>
              <div id="youtube-list-container"></div>
            </div>
            <button type="submit">Update Featured</button>
          </form>
        </div>
      </section>
    </main>
  </div>
  
  <div id="login-modal" class="modal">
    <div class="modal-content">
      <span class="close-button">&times;</span>
      <h2>Admin Login</h2>
      <form id="login-form">
        <div>
          <label for="username">Username:</label>
          <input type="text" id="username" autocomplete="username" value="admin">
        </div>
        <div>
          <label for="password">Password:</label>
          <input type="password" id="password" autocomplete="current-password">
        </div>
        <div id="login-error" class="error"></div>
        <div class="form-actions">
          <button type="button" id="cancel-login-btn">Cancel</button>
          <button type="submit">Login</button>
        </div>
      </form>
    </div>
  </div>
  
  <div id="post-modal" class="modal">
    <div class="modal-content">
      <span class="close-button">&times;</span>
      <h2 id="form-heading">New Post</h2>
      <form id="post-form">
        <input type="hidden" id="post-id">
        <div>
          <label for="post-title">Title:</label>
          <input type="text" id="post-title" required>
        </div>
        <div>
          <label for="editor-container">Content:</label>
          <div id="editor-container"></div>
        </div>
        <div>
          <label for="post-image-url">Image:</label>
          <div class="image-upload-group">
            <input type="url" id="post-image-url" placeholder="Upload an image or enter URL">
            <button type="button" id="post-image-upload-btn">Upload</button>
            <input type="file" id="post-image-upload" accept="image/*" style="display:none;">
          </div>
          <div id="image-preview-container">
            <div id="post-image-preview" class="image-preview"></div>
            <button type="button" id="remove-post-image-btn" style="display:none;">Remove Image</button>
          </div>
          <progress id="upload-progress" value="0" max="100" style="display:none; width:100%;"></progress>
        </div>
        <div class="form-actions">
          <button type="button" id="cancel-edit-btn" style="display:none;">Cancel</button>
          <button type="submit" id="submit-post-btn">Create Post</button>
        </div>
      </form>
    </div>
  </div>
  
  <script src="https://cdn.quilljs.com/1.3.7/quill.js"></script>
  <script src="./news.js"></script>
</body>
</html>
