<body data-state="farewell">
    <header class="feader" style="min-height:212px;">
        <div class="contain">
            <div class="left">
                <nav>
                    <ul><li><a href="./index.html">HOME</a></li>
                        <li><a href="javascript:void(0);" onclick="openEventsPopup()">EVENTS</a></li>
                        <li><a href="./more.htm">MORE</a></li>
                        <li><a href="./about.htm">ABOUT</a></li>
                    
                    </ul>
                </nav>
            </div>
            <div class="right">
                <h1 class="header-title">
                    <span class="span2">FAREWELL</span>
                    <span class="sulk drop-wiggle throb-element"> & HOWDY &nbsp;<span id="swico"><img src="./img/swap.png" class="insect flipp cocoon" alt="click-drag"></span></span>
                </h1>
            </div>
        </div>
    </header>

    <main class="grid-container">
    <div class="card" id="wa" style="padding: 0px; background:#000000;"><img alt="mascot" src="./img/fp1.png" class="insect"></div>
    
       <div class="card" id="nkey"><section><h2 style="text-align: left; margin:var(--padding-large);">BOOK</h2>
        <p class="pp nrml">Schedule a show or event with our booking team </p><a href="mailto:booking@farewellcafe.com?subject=Booking"><span class="pp nrml" style="font-size:1.8rem;"><button style="width:256px;">booking@farewellcafe.com</span></button></a></section> 
       <br> <section><p class="pp nrml">For <em>local</em> artists interested in opening a show etc. please fill out the form below:</p>
       
       <form id="booking-form" style="max-width:520px; margin:1rem auto; display:flex; flex-direction:column; gap:0.75rem;">
         <input type="text" id="bf-artist" placeholder="Band / artist name *" required style="padding:0.6rem; font-family:inherit; font-size:1rem; border:1px solid var(--nav-border-color); background:rgba(255,255,255,0.9);">
         <input type="email" id="bf-email" placeholder="Email *" required style="padding:0.6rem; font-family:inherit; font-size:1rem; border:1px solid var(--nav-border-color); background:rgba(255,255,255,0.9);">
         <input type="text" id="bf-music" placeholder="Music link — YouTube / Bandcamp preferred *" required style="padding:0.6rem; font-family:inherit; font-size:1rem; border:1px solid var(--nav-border-color); background:rgba(255,255,255,0.9);">
         <input type="text" id="bf-social" placeholder="Social media / Linktree link" style="padding:0.6rem; font-family:inherit; font-size:1rem; border:1px solid var(--nav-border-color); background:rgba(255,255,255,0.9);">
         <input type="text" id="bf-genre" placeholder="Genre / one-sentence description" style="padding:0.6rem; font-family:inherit; font-size:1rem; border:1px solid var(--nav-border-color); background:rgba(255,255,255,0.9);">
         <textarea id="bf-notes" placeholder="Anything else we should know? (availability, stage requirements, etc.)" rows="3" style="padding:0.6rem; font-family:inherit; font-size:1rem; border:1px solid var(--nav-border-color); background:rgba(255,255,255,0.9); resize:vertical;"></textarea>
         <button type="submit" style="padding:0.7rem 1.5rem; font-family:inherit; font-size:1rem; cursor:pointer;">SUBMIT</button>
         <p id="bf-msg" style="display:none; font-weight:bold;"></p>
       </form>
       </section></div>

 
    </main>
    
      <hr style="color: transparent; padding:24px; border: 0px transparent;">
       <p><img src="./img/fm2.png" alt="mascot" style="width:256px; height: auto;" class="nicica insect drop-wiggle"></p>
      <hr style="color: transparent; padding:24px; border: 0px transparent;">
    <footer><div>
        <p id="address">6515 STADIUM DRIVE, KANSAS CITY, MISSOURI</p></div>
    </footer>
    <script>
        document.getElementById('booking-form').addEventListener('submit', async function(e) {
            // Prefill https:// if user left it blank or only typed a domain
            ['bf-music', 'bf-social'].forEach(id => {
                const el = document.getElementById(id);
                if (el.value && !el.value.match(/^https?:\/\//)) {
                    el.value = 'https://' + el.value;
                }
            });
            e.preventDefault();
            const msg = document.getElementById('bf-msg');
            const btn = this.querySelector('button[type=submit]');
            btn.disabled = true;
            btn.textContent = 'Sending...';
            try {
                const res = await fetch('/api/booking', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        artist_name: document.getElementById('bf-artist').value,
                        email: document.getElementById('bf-email').value,
                        music_link: document.getElementById('bf-music').value,
                        social_link: document.getElementById('bf-social').value,
                        genre: document.getElementById('bf-genre').value,
                        notes: document.getElementById('bf-notes').value
                    })
                });
                const data = await res.json();
                if (data.success) {
                    msg.style.display = 'block';
                    msg.style.color = '#b0ee00';
                    msg.textContent = 'Got it! We\'ll keep you in mind. Note that filling out the form multiple times won\'t help your chances.';
                    this.reset();
                    btn.disabled = false;
                    btn.textContent = 'SUBMIT';
                } else {
                    throw new Error(data.error);
                }
            } catch(err) {
                btn.disabled = false;
                btn.textContent = 'SUBMIT';
                msg.style.display = 'block';
                msg.style.color = '#ff2b13';
                msg.textContent = 'Something went wrong, please try again.';
            }
        });

        // Function to open events popup
        function openEventsPopup() {
            const venue = document.body.dataset.state || 'farewell';
            const modal = document.getElementById('events-page-modal');
            const iframe = document.getElementById('events-iframe');
            iframe.src = `./events.html?venue=${venue}`;
            modal.style.display = 'block';
            document.body.style.overflow = 'hidden';
        }
    </script>

  <div id="events-page-modal" style="display:none; position:fixed; inset:0; z-index:10000; background:rgba(29,2,2,0.88); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);">
    <iframe id="events-iframe" src="" style="position:absolute; inset:0; width:100%; height:100%; border:none;"></iframe>
  </div>
</html>
