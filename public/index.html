<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>farewell / howdy</title>
    <style>
      @font-face {
        font-family: 'db';
        src: url('fnt/db.woff2') format('woff2');
      }
      @font-face {
        font-family: 'mrt';
        src: url('fnt/mrt.woff2') format('woff2');
      }
      @font-face {
        font-family: 'ds';
        src: url('fnt/ds.woff2') format('woff2');
      }
      @font-face {
        font-family: 'hnb2';
        src: url('fnt/hnb2.woff2') format('woff2');
      }
      @font-face {
        font-family: 'kb';
        src: url('fnt/kb.woff2') format('woff2');
      }
      * {
        box-sizing: border-box;
      }
      body {
        background-color: #050505ff;
        color: #ffffffff;
        font-family: 'kb', sans-serif;
        padding: 20px;
        margin: 0px;
        text-align: center;
      }
      h1 {
        font-family: 'mrt', sans-serif;
        font-size: clamp(2rem, 6vw, 4.5rem);
        color: #b0ee00ff;
        text-transform: lowercase;
        margin-top: 10px;
        margin-bottom: 20px;
        letter-spacing: -1px;
        text-shadow: 3px 3px 0px #ff2b13ff;
      }
      p.status {
        font-family: 'db', serif;
        font-size: clamp(1.2rem, 3.5vw, 2.2rem);
        color: #00e2ffff;
        margin-bottom: 30px;
        text-transform: uppercase;
        letter-spacing: 2px;
      }
      .calendars {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
        margin-bottom: 40px;
      }
      .calendar-box {
        border: 4px dashed #ff2b13ff;
        padding: 10px;
        background-color: #111111ff;
        max-width: 650px;
        width: 100%;
      }
      .calendar-box img {
        width: 100%;
        height: auto;
        display: block;
      }
      .calendar-title {
        font-family: 'ds', sans-serif;
        font-size: 1.8rem;
        color: #ffff00ff;
        margin-top: 10px;
        text-align: left;
      }
      .socials {
        font-family: 'hnb2', sans-serif;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 15px;
        margin-top: 30px;
        margin-bottom: 50px;
      }
      .socials a {
        background-color: #ffffffff;
        color: #000000ff;
        font-weight: bold;
        text-decoration: none;
        padding: 12px 20px;
        font-size: 1.1rem;
        border: 2px solid #000000ff;
        box-shadow: 5px 5px 0px #b0ee00ff;
        transition: transform 0.1s;
      }
      .socials a:hover {
        transform: translate(-3px, -3px);
        background-color: #ffff00ff;
        box-shadow: 8px 8px 0px #ff2b13ff;
      }
    </style>
  </head>
  <body>
    <h1>farewell / howdy new site coming soon</h1>
    <p class="status">calendar updates &amp; information below</p>
    <div class="calendars">
      <div class="calendar-box">
        <img src="img/fwcal.png" alt="Farewell Calendar" />
        <div class="calendar-title">FAREWELL</div>
      </div>
      <div class="calendar-box">
        <img src="img/hycal.png" alt="Howdy Calendar" />
        <div class="calendar-title">HOWDY</div>
      </div>
    </div>
    <div class="socials">
      <a href="https://instagram.com/farewellkcmo" target="_blank" rel="noopener">Farewell IG</a>
      <a href="https://www.facebook.com/farewelltransmission" target="_blank" rel="noopener">Farewell FB</a>
      <a href="https://instagram.com/howdykcmo" target="_blank" rel="noopener">Howdy IG</a>
      <a href="https://www.facebook.com/howdykcmo" target="_blank" rel="noopener">Howdy FB</a>
      <a href="https://www.instagram.com/howdydiythrift/" target="_blank" rel="noopener">Howdy Thrift IG</a>
    </div>
    <script>
      document.addEventListener('click', function(e) {
        var flash = document.createElement('div');
        flash.style.position = 'fixed';
        flash.style.top = '0px';
        flash.style.left = '0px';
        flash.style.width = '100vw';
        flash.style.height = '100vh';
        flash.style.backgroundColor = '#ff005533';
        flash.style.pointerEvents = 'none';
        flash.style.zIndex = '99999';
        document.body.appendChild(flash);
        setTimeout(function() {
          flash.remove();
        }, 100);
      });
    </script>
  </body>
</html>
